<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula Musical Interactiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Babel para compilar React/TSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
      }
      .key-shadow {
        box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      }
      .key-shadow:active {
        box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        transform: translateY(3px);
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body class="bg-sky-100 text-slate-800">
    <div id="root"></div>

    <!-- Script principal con toda la lógica de la App -->
    <script type="text/babel" data-type="module" data-presets="react,typescript">
      import React, { useState, useEffect, useCallback } from 'react';
      import ReactDOM from 'react-dom/client';
      import { GoogleGenAI } from '@google/genai';

      // --- CONSTANTS & TYPES ---
      const InstrumentType = {
        PIANO: 'PIANO',
        GUITAR: 'GUITAR',
        FLUTE: 'FLUTE'
      };

      const SCALE = [
        { id: 'C4', name: 'Do', notation: 'C4', frequency: 261.63, color: 'bg-red-400', textColor: 'text-white' },
        { id: 'D4', name: 'Re', notation: 'D4', frequency: 293.66, color: 'bg-orange-400', textColor: 'text-white' },
        { id: 'E4', name: 'Mi', notation: 'E4', frequency: 329.63, color: 'bg-yellow-400', textColor: 'text-yellow-900' },
        { id: 'F4', name: 'Fa', notation: 'F4', frequency: 349.23, color: 'bg-green-400', textColor: 'text-white' },
        { id: 'G4', name: 'Sol', notation: 'G4', frequency: 392.00, color: 'bg-teal-400', textColor: 'text-white' },
        { id: 'A4', name: 'La', notation: 'A4', frequency: 440.00, color: 'bg-blue-400', textColor: 'text-white' },
        { id: 'B4', name: 'Si', notation: 'B4', frequency: 493.88, color: 'bg-indigo-400', textColor: 'text-white' },
        { id: 'C5', name: 'Do', notation: 'C5', frequency: 523.25, color: 'bg-red-500', textColor: 'text-white' },
      ];

      // --- SERVICES ---
      
      // Audio Service
      class AudioService {
        constructor() {
          this.audioContext = null;
        }

        getContext() {
          if (!this.audioContext) {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          return this.audioContext;
        }

        async playNote(frequency, instrument) {
          const ctx = this.getContext();
          if (ctx.state === 'suspended') {
            await ctx.resume();
          }

          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();

          osc.connect(gainNode);
          gainNode.connect(ctx.destination);

          osc.frequency.value = frequency;

          const now = ctx.currentTime;
          osc.start(now); // Importante: start antes de configurar stop

          switch (instrument) {
            case InstrumentType.PIANO:
              osc.type = 'triangle';
              gainNode.gain.setValueAtTime(0, now);
              gainNode.gain.linearRampToValueAtTime(0.6, now + 0.02);
              gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
              osc.stop(now + 1.5);
              break;
            case InstrumentType.GUITAR:
              osc.type = 'sawtooth';
              gainNode.gain.setValueAtTime(0, now);
              gainNode.gain.linearRampToValueAtTime(0.4, now + 0.05);
              gainNode.gain.exponentialRampToValueAtTime(0.01, now + 2.0);
              osc.stop(now + 2.0);
              break;
            case InstrumentType.FLUTE:
              osc.type = 'sine';
              gainNode.gain.setValueAtTime(0, now);
              gainNode.gain.linearRampToValueAtTime(0.5, now + 0.2);
              gainNode.gain.linearRampToValueAtTime(0.3, now + 0.5); 
              gainNode.gain.linearRampToValueAtTime(0, now + 1.2); 
              osc.stop(now + 1.2);
              break;
          }
        }
      }
      const audioService = new AudioService();

      // Gemini Service
      const getMusicTrivia = async (topic) => {
        // En entorno estático sin build, process.env no existe.
        // Simulamos o leemos si existe, pero no fallamos.
        const apiKey = (typeof process !== 'undefined' && process.env && process.env.API_KEY) ? process.env.API_KEY : '';
        
        if (!apiKey) {
           console.warn("API Key missing");
           return "Necesitas configurar tu API Key para ver curiosidades.";
        }

        const ai = new GoogleGenAI({ apiKey });
        try {
          const response = await ai.models.generateContent({
            model: 'gemini-2.5-flash',
            contents: `Escribe una curiosidad divertida y educativa muy breve (máximo 40 palabras) para niños sobre: ${topic}. El tono debe ser alegre y motivador.`,
          });
          return response.text || "No se pudo generar la curiosidad.";
        } catch (error) {
          console.error("Error fetching trivia:", error);
          return "¡Ups! El maestro de música está tomando un descanso. Intenta luego.";
        }
      };

      // --- COMPONENTS ---
      const Key = ({ note, onClick, disabled, highlight }) => {
        return (
          <button
            onClick={() => onClick(note)}
            disabled={disabled}
            className={`
              relative h-32 w-12 sm:h-48 sm:w-16 md:h-64 md:w-20 lg:w-24 
              rounded-b-lg mx-1 focus:outline-none transition-all duration-100
              key-shadow flex flex-col justify-end items-center pb-4
              ${note.color} ${note.textColor}
              ${highlight ? 'ring-4 ring-yellow-400 scale-105 z-10' : ''}
              ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:brightness-110'}
            `}
            aria-label={`Nota ${note.name}`}
          >
            <span className="text-xl font-bold mb-1">{note.name}</span>
            <span className="text-xs opacity-75 font-mono">{note.notation}</span>
            <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-white to-transparent opacity-20 pointer-events-none rounded-b-lg"></div>
          </button>
        );
      };

      const InstrumentSelector = ({ current, onChange }) => {
        const instruments = [
          { type: InstrumentType.PIANO, label: '🎹 Piano', color: 'bg-indigo-100 text-indigo-700 border-indigo-300' },
          { type: InstrumentType.GUITAR, label: '🎸 Guitarra', color: 'bg-orange-100 text-orange-700 border-orange-300' },
          { type: InstrumentType.FLUTE, label: '🪈 Flauta', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' },
        ];

        return (
          <div className="flex justify-center space-x-4 mb-8">
            {instruments.map((inst) => (
              <button
                key={inst.type}
                onClick={() => onChange(inst.type)}
                className={`
                  px-4 py-2 rounded-full border-2 font-semibold transition-all transform hover:scale-105
                  ${current === inst.type ? `${inst.color} ring-2 ring-offset-2 ring-blue-300 shadow-md` : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'}
                `}
              >
                {inst.label}
              </button>
            ))}
          </div>
        );
      };

      const TriviaCard = ({ instrument }) => {
        const [trivia, setTrivia] = useState('');
        const [loading, setLoading] = useState(false);

        const fetchTrivia = async () => {
          setLoading(true);
          const topicMap = {
            [InstrumentType.PIANO]: "el piano",
            [InstrumentType.GUITAR]: "la guitarra acústica",
            [InstrumentType.FLUTE]: "la flauta dulce"
          };
          
          const fact = await getMusicTrivia(topicMap[instrument]);
          setTrivia(fact);
          setLoading(false);
        };

        return (
          <div className="mt-8 max-w-md mx-auto p-4 bg-white rounded-2xl shadow-lg border border-purple-100">
            <div className="flex items-center justify-between mb-2">
              <h3 className="text-lg font-bold text-purple-600 flex items-center gap-2">
                <span>✨</span> Curiosidad Musical
              </h3>
              <button 
                onClick={fetchTrivia}
                disabled={loading}
                className="text-sm bg-purple-100 hover:bg-purple-200 text-purple-700 px-3 py-1 rounded-full transition-colors"
              >
                {loading ? 'Pensando...' : '¡Dime algo!'}
              </button>
            </div>
            {trivia ? (
               <div className="bg-purple-50 p-3 rounded-xl text-purple-900 text-sm leading-relaxed animate-fade-in">
                 {trivia}
               </div>
            ) : (
              <p className="text-gray-400 text-sm italic p-2 text-center">
                Pulsa el botón para aprender algo nuevo sobre este instrumento.
              </p>
            )}
          </div>
        );
      };

      // --- MAIN APP ---
      const App = () => {
        const [instrument, setInstrument] = useState(InstrumentType.PIANO);
        const [lastPlayed, setLastPlayed] = useState(null);
        
        const [game, setGame] = useState({
          isActive: false,
          targetNote: null,
          score: 0,
          message: "¡Escucha y adivina!",
          status: 'idle'
        });

        const playNote = useCallback((note) => {
          audioService.playNote(note.frequency, instrument);
          setLastPlayed(note);

          if (game.isActive && game.status === 'waiting') {
              checkGameGuess(note);
          }
        }, [instrument, game.isActive, game.status, game.targetNote]);

        const checkGameGuess = (playedNote) => {
          if (!game.targetNote) return;

          if (playedNote.id === game.targetNote.id) {
            setGame(prev => ({
              ...prev,
              score: prev.score + 10,
              message: "¡Correcto! 🎵 Muy bien.",
              status: 'success'
            }));
            setTimeout(() => startRound(), 1500);
          } else {
            setGame(prev => ({
              ...prev,
              message: "¡Casi! Intenta de nuevo.",
              status: 'failure'
            }));
            setTimeout(() => setGame(prev => ({...prev, status: 'waiting', message: "Intenta de nuevo."})), 1000);
          }
        };

        const startGame = () => {
          setGame({
            isActive: true,
            targetNote: null,
            score: 0,
            message: "Escucha atentamente...",
            status: 'idle'
          });
          startRound();
        };

        const startRound = () => {
          const randomNote = SCALE[Math.floor(Math.random() * SCALE.length)];
          setGame(prev => ({
            ...prev,
            targetNote: randomNote,
            message: "Escuchando...",
            status: 'idle'
          }));

          setTimeout(() => {
              audioService.playNote(randomNote.frequency, instrument);
              setGame(prev => ({
                  ...prev,
                  message: "¿Qué nota sonó?",
                  status: 'waiting'
              }));
          }, 500);
        };

        const stopGame = () => {
          setGame({
              isActive: false,
              targetNote: null,
              score: 0,
              message: "¡Juega cuando quieras!",
              status: 'idle'
          });
        };

        const replayTargetNote = () => {
            if (game.targetNote && game.status === 'waiting') {
              audioService.playNote(game.targetNote.frequency, instrument);
            }
        };

        return (
          <div className="min-h-screen p-4 sm:p-8 flex flex-col items-center">
            <header className="text-center mb-8">
              <h1 className="text-4xl sm:text-5xl font-black text-sky-600 tracking-tight mb-2 drop-shadow-sm">
                Aula Musical 🎵
              </h1>
              <p className="text-lg text-slate-500 font-medium">Aprende, Toca y Juega</p>
            </header>

            <main className="w-full max-w-4xl bg-white/50 backdrop-blur-sm rounded-3xl p-6 shadow-xl border border-white/60">
              
              <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                  <InstrumentSelector current={instrument} onChange={setInstrument} />
                  
                  <div className="flex items-center gap-4 bg-white p-2 rounded-full shadow-sm border border-slate-100">
                      {!game.isActive ? (
                          <button 
                              onClick={startGame}
                              className="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-full transition-transform transform active:scale-95 shadow-lg shadow-green-200"
                          >
                              🎮 Jugar a Adivinar
                          </button>
                      ) : (
                          <div className="flex items-center gap-3 px-2">
                               <span className="font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-lg">Puntos: {game.score}</span>
                               <button 
                                  onClick={stopGame}
                                  className="text-red-500 hover:bg-red-50 px-3 py-1 rounded-full text-sm font-semibold"
                              >
                                  Salir
                              </button>
                          </div>
                      )}
                  </div>
              </div>

              {game.isActive && (
                  <div className={`mb-6 p-4 rounded-xl text-center transition-colors duration-300 ${
                      game.status === 'success' ? 'bg-green-100 text-green-800' :
                      game.status === 'failure' ? 'bg-red-100 text-red-800' : 'bg-sky-50 text-sky-800'
                  }`}>
                      <p className="text-xl font-bold">{game.message}</p>
                      {game.status === 'waiting' && (
                          <button 
                              onClick={replayTargetNote}
                              className="mt-2 text-sm underline opacity-70 hover:opacity-100"
                          >
                              🔊 Repetir Sonido
                          </button>
                      )}
                  </div>
              )}

              <div className="flex justify-center items-end h-64 sm:h-80 mb-6 pb-4 overflow-x-auto">
                {SCALE.map((note) => (
                  <Key 
                    key={note.id} 
                    note={note} 
                    onClick={playNote}
                    highlight={game.status === 'success' && game.targetNote?.id === note.id}
                  />
                ))}
              </div>

              {!game.isActive && lastPlayed && (
                   <div className="text-center animate-bounce-short">
                       <p className="text-gray-400 text-sm uppercase tracking-widest font-bold mb-1">Has tocado</p>
                       <div className={`inline-block px-6 py-2 rounded-full text-2xl font-bold ${lastPlayed.color} ${lastPlayed.textColor} shadow-lg`}>
                           {lastPlayed.name} <span className="text-base opacity-75">({lastPlayed.notation})</span>
                       </div>
                   </div>
              )}

              <div className="border-t border-slate-200 pt-6 mt-6">
                  <TriviaCard instrument={instrument} />
              </div>

            </main>

            <footer className="mt-12 text-center text-slate-400 text-sm">
               <p>Hecho con ❤️ y React</p>
            </footer>
          </div>
        );
      };

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
